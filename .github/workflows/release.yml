name: Release

# Build installers for all three platforms when a version tag is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      # electron-builder uploads the installers to a draft GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # electron-builder downloads its own Electron for packaging, so the
          # npm electron binary isn't needed here.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build and package
        # Publishes the installers to a DRAFT GitHub Release for the tag —
        # reviewed and published manually. Artifacts below stay as a backup.
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hatchling-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
          if-no-files-found: ignore
